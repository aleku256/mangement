name: app_sacco_mobile
description: APP SACCO official member mobile app.
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_sacco_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_sacco_logo.png
  min_sdk_android: 21
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/images/app_sacco_logo.png

flutter_native_splash:
  color: '#FFFFFF'
  image: assets/images/app_sacco_logo.png
  android: true
  ios: false
  android_12:
    color: '#FFFFFF'
    image: assets/images/app_sacco_logo.png
