name: Build APP SACCO APK

on:
  push:
    paths:
      - 'appsacco-member-v2/**'
      - '.github/workflows/appsacco-apk.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create APP SACCO Android v1.2.0
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/appsacco_app
          flutter create --platforms=android --org co.ellnoo --project-name app_sacco_mobile /tmp/appsacco_app
          cp appsacco-member-v2/pubspec.yaml /tmp/appsacco_app/pubspec.yaml
          cp appsacco-member-v2/analysis_options.yaml /tmp/appsacco_app/analysis_options.yaml

          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('appsacco-member-v2/main_v120.dart.gz.b64').read_text().strip()
          Path('/tmp/appsacco_app/lib/main.dart').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY

          mkdir -p /tmp/appsacco_app/assets
          base64 --decode appsacco-member-v2/logo256.b64 > /tmp/appsacco_app/assets/app_sacco_logo.png

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsacco_app/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + perms)
          s = s.replace('android:label="app_sacco_mobile"', 'android:label="APP SACCO"')
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="portrait"')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsacco_app/android/app/build.gradle.kts')
          p.write_text(p.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 23'))
          PY

          grep -q 'AppSaccoDownloads' /tmp/appsacco_app/lib/main.dart
          if grep -q 'FloatingActionButton' /tmp/appsacco_app/lib/main.dart; then
            echo 'v1.2.0 must not contain the duplicate native More button' >&2
            exit 1
          fi

      - name: Get packages
        working-directory: /tmp/appsacco_app
        run: flutter pub get

      - name: Format source
        working-directory: /tmp/appsacco_app
        run: dart format lib/main.dart

      - name: Generate launcher icon
        working-directory: /tmp/appsacco_app
        run: dart run flutter_launcher_icons

      - name: Generate splash
        working-directory: /tmp/appsacco_app
        run: dart run flutter_native_splash:create

      - name: Analyze app source
        working-directory: /tmp/appsacco_app
        run: flutter analyze lib/main.dart --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        working-directory: /tmp/appsacco_app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          set -euxo pipefail
          test -s /tmp/appsacco_app/build/app/outputs/flutter-apk/app-release.apk
          cp /tmp/appsacco_app/build/app/outputs/flutter-apk/app-release.apk APP_SACCO_Member_v1.2.0.apk
          sha256sum APP_SACCO_Member_v1.2.0.apk > APP_SACCO_Member_v1.2.0.sha256.txt
          cat APP_SACCO_Member_v1.2.0.sha256.txt
          ls -lh APP_SACCO_Member_v1.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APP_SACCO_MEMBER_V1_2_0_APK
          path: |
            APP_SACCO_Member_v1.2.0.apk
            APP_SACCO_Member_v1.2.0.sha256.txt
          retention-days: 7
