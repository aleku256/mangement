name: Build APP SACCO Member APK V2

on:
  pull_request:
    paths:
      - 'appsacco-member-v2/**'
      - '.github/workflows/appsacco-member-v2-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/appsacco_member_v2
          flutter create --platforms=android --org co.ellnoo --project-name app_sacco_mobile /tmp/appsacco_member_v2
          cp appsacco-member-v2/pubspec.yaml /tmp/appsacco_member_v2/pubspec.yaml
          cp appsacco-member-v2/analysis_options.yaml /tmp/appsacco_member_v2/analysis_options.yaml

          # Pull the reviewed v1.2.0 app source and SACCO logo from an immutable repository commit.
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/aleku256/mangement/eef895ee6efee3a05257ca6920fe3b272578698d/appsacco-member-v2/main_v120.dart.gz.b64 \
            -o /tmp/main_v120.dart.gz.b64
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/aleku256/mangement/eef895ee6efee3a05257ca6920fe3b272578698d/appsacco-member-v2/logo256.b64 \
            -o /tmp/logo256.b64

          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('/tmp/main_v120.dart.gz.b64').read_text().strip()
          Path('/tmp/appsacco_member_v2/lib/main.dart').write_bytes(
              gzip.decompress(base64.b64decode(encoded))
          )
          PY

          mkdir -p /tmp/appsacco_member_v2/assets
          base64 --decode /tmp/logo256.b64 > /tmp/appsacco_member_v2/assets/app_sacco_logo.png

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsacco_member_v2/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + perms)
          s = s.replace('android:label="app_sacco_mobile"', 'android:label="APP SACCO"')
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="portrait"')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsacco_member_v2/android/app/build.gradle.kts')
          p.write_text(p.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 23'))
          PY

          # Release guards: download bridge must exist and the duplicate floating More button must not.
          grep -q 'AppSaccoDownloads' /tmp/appsacco_member_v2/lib/main.dart
          if grep -q 'FloatingActionButton' /tmp/appsacco_member_v2/lib/main.dart; then
            echo 'Unexpected duplicate native More button found' >&2
            exit 1
          fi

      - name: Get packages
        working-directory: /tmp/appsacco_member_v2
        run: flutter pub get

      - name: Format source
        working-directory: /tmp/appsacco_member_v2
        run: dart format lib/main.dart

      - name: Generate launcher icon
        working-directory: /tmp/appsacco_member_v2
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: /tmp/appsacco_member_v2
        run: dart run flutter_native_splash:create

      - name: Analyze application source
        working-directory: /tmp/appsacco_member_v2
        run: flutter analyze lib/main.dart --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        working-directory: /tmp/appsacco_member_v2
        run: flutter build apk --release

      - name: Verify release APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s /tmp/appsacco_member_v2/build/app/outputs/flutter-apk/app-release.apk
          cp /tmp/appsacco_member_v2/build/app/outputs/flutter-apk/app-release.apk APP_SACCO_Member_v1.2.0.apk
          sha256sum APP_SACCO_Member_v1.2.0.apk > APP_SACCO_Member_v1.2.0.sha256.txt
          cat APP_SACCO_Member_v1.2.0.sha256.txt
          ls -lh APP_SACCO_Member_v1.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APP_SACCO_MEMBER_V1_2_0_APK
          path: |
            APP_SACCO_Member_v1.2.0.apk
            APP_SACCO_Member_v1.2.0.sha256.txt
          retention-days: 7
