name: Build APP SACCO Member APK V2

on:
  pull_request:
    paths:
      - 'appsacco-member-v2/**'
      - '.github/workflows/appsacco-member-v2-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/appsacco_member_v2
          flutter create --platforms=android --org co.ellnoo --project-name app_sacco_mobile /tmp/appsacco_member_v2
          cp appsacco-member-v2/pubspec.yaml /tmp/appsacco_member_v2/pubspec.yaml
          cp appsacco-member-v2/analysis_options.yaml /tmp/appsacco_member_v2/analysis_options.yaml
          cp appsacco-member-v2/main.dart /tmp/appsacco_member_v2/lib/main.dart
          python3 appsacco-member-v2/native_menu_patch.py /tmp/appsacco_member_v2/lib/main.dart
          sed -i 's/version: 1.1.0+2/version: 1.1.1+3/' /tmp/appsacco_member_v2/pubspec.yaml
          mkdir -p /tmp/appsacco_member_v2/assets
          base64 --decode appsacco-member-v2/logo.b64 > /tmp/appsacco_member_v2/assets/app_sacco_logo.png

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsacco_member_v2/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + perms)
          s = s.replace('android:label="app_sacco_mobile"', 'android:label="APP SACCO"')
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="portrait"')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/appsacco_member_v2/android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          p.write_text(s)
          PY

      - name: Get packages
        working-directory: /tmp/appsacco_member_v2
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: /tmp/appsacco_member_v2
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        working-directory: /tmp/appsacco_member_v2
        run: dart run flutter_native_splash:create

      - name: Analyze
        working-directory: /tmp/appsacco_member_v2
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        working-directory: /tmp/appsacco_member_v2
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          cp /tmp/appsacco_member_v2/build/app/outputs/flutter-apk/app-release.apk APP_SACCO_Member_v1.1.1.apk
          sha256sum APP_SACCO_Member_v1.1.1.apk
          ls -lh APP_SACCO_Member_v1.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APP_SACCO_MEMBER_V1_1_1_APK
          path: APP_SACCO_Member_v1.1.1.apk
          retention-days: 7
