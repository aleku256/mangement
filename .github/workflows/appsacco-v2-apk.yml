name: Build APP SACCO V2 APK

on:
  pull_request:
    paths:
      - 'appsacco-v2/**'
      - '.github/workflows/appsacco-v2-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/app_sacco_v2
          flutter create --platforms=android --org com.appsacco --project-name app_sacco /tmp/app_sacco_v2
          cp appsacco-v2/pubspec.yaml /tmp/app_sacco_v2/pubspec.yaml
          cp appsacco-v2/analysis_options.yaml /tmp/app_sacco_v2/analysis_options.yaml
          cp appsacco-v2/main.dart /tmp/app_sacco_v2/lib/main.dart
          mkdir -p /tmp/app_sacco_v2/assets/images
          cat appsacco-v2/logo.b64.* | base64 --decode > /tmp/app_sacco_v2/assets/images/app_sacco_logo.png

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/app_sacco_v2/android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + permissions)
          s = s.replace('android:label="app_sacco"', 'android:label="APP SACCO"')
          p.write_text(s)
          PY

      - name: Get packages
        working-directory: /tmp/app_sacco_v2
        run: flutter pub get

      - name: Generate app icon
        working-directory: /tmp/app_sacco_v2
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        working-directory: /tmp/app_sacco_v2
        run: dart run flutter_native_splash:create

      - name: Analyze
        working-directory: /tmp/app_sacco_v2
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        working-directory: /tmp/app_sacco_v2
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          cp /tmp/app_sacco_v2/build/app/outputs/flutter-apk/app-release.apk APP_SACCO_v2.0.0.apk
          ls -lh APP_SACCO_v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APP_SACCO_V2_APK
          path: APP_SACCO_v2.0.0.apk
          retention-days: 7
