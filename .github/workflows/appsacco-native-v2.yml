name: Build APP SACCO Native v2 APK

on:
  pull_request:
    paths:
      - 'appsacco-native-v2/**'
      - '.github/workflows/appsacco-native-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create native project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/appsacco_native
          flutter create --platforms=android --org co.ellnoo --project-name app_sacco_mobile /tmp/appsacco_native
          cp appsacco-native-v2/main.dart /tmp/appsacco_native/lib/main.dart

          # v2.1 parity patch: native UI backed by the same member data/services as /member-app.
          cat \
            appsacco-native-v2/v21part00.txt \
            appsacco-native-v2/v21part01.txt \
            appsacco-native-v2/v21part02.txt \
            appsacco-native-v2/v21part03.txt \
            appsacco-native-v2/v21part04.txt \
            appsacco-native-v2/v21part05.txt \
            > /tmp/patch_v21.py.gz.b64
          base64 -d /tmp/patch_v21.py.gz.b64 | gzip -d > /tmp/patch_v21.py
          python3 /tmp/patch_v21.py

          # Current stable Flutter analyzer compatibility.
          sed -i 's/const ListView(/ListView(/g' /tmp/appsacco_native/lib/main.dart

          cat > /tmp/appsacco_native/pubspec.yaml <<'EOF'
          name: app_sacco_mobile
          version: 2.1.0+9
          publish_to: 'none'
          environment:
            sdk: '>=3.12.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            http: ^1.2.2
            flutter_secure_storage: ^9.2.2
            intl: ^0.20.2
            pdf: ^3.11.3
            printing: ^5.14.2
            path_provider: ^2.1.5
            share_plus: ^10.1.4
            url_launcher: ^6.3.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0
            flutter_launcher_icons: ^0.14.3
            flutter_native_splash: ^2.4.4
          flutter:
            uses-material-design: true
            assets:
              - assets/app_sacco_logo.png
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/app_sacco_logo.png
            adaptive_icon_background: '#FFFFFF'
            adaptive_icon_foreground: assets/app_sacco_logo.png
            min_sdk_android: 23
          flutter_native_splash:
            color: '#F4FBF6'
            image: assets/app_sacco_logo.png
            android_12:
              color: '#F4FBF6'
              image: assets/app_sacco_logo.png
          EOF

          mkdir -p /tmp/appsacco_native/assets
          cat appsacco-native-v2/logo.part00.b64 appsacco-native-v2/logo.part01.b64 > /tmp/app_sacco_logo.b64
          base64 -d /tmp/app_sacco_logo.b64 > /tmp/appsacco_native/assets/app_sacco_logo.png
          file /tmp/appsacco_native/assets/app_sacco_logo.png
          test -s /tmp/appsacco_native/assets/app_sacco_logo.png

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/appsacco_native/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.INTERNET' not in s:
              s=s.replace(marker, marker+'\n    <uses-permission android:name="android.permission.INTERNET" />')
          s=s.replace('android:label="app_sacco_mobile"','android:label="APP SACCO"')
          s=s.replace('android:name=".MainActivity"','android:name=".MainActivity"\n            android:screenOrientation="portrait"')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/appsacco_native/android/app/build.gradle.kts')
          s=p.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          p.write_text(s)
          PY

          grep -q "https://ellnoo.com/appsacco-api/v1" /tmp/appsacco_native/lib/main.dart
          grep -q "class SharesPage" /tmp/appsacco_native/lib/main.dart
          grep -q "class ReceiptsPage" /tmp/appsacco_native/lib/main.dart
          grep -q "class DocumentsPage" /tmp/appsacco_native/lib/main.dart
          grep -q "class SecurityPage" /tmp/appsacco_native/lib/main.dart
          grep -q "class AiAssistantPage" /tmp/appsacco_native/lib/main.dart
          grep -q "class StaffChatPage" /tmp/appsacco_native/lib/main.dart
          grep -q "class ReferralsPage" /tmp/appsacco_native/lib/main.dart
          grep -q "class PinUnlockPage" /tmp/appsacco_native/lib/main.dart
          grep -q "PdfPreview" /tmp/appsacco_native/lib/main.dart
          grep -q "/member/savings" /tmp/appsacco_native/lib/main.dart
          grep -q "/member/shares" /tmp/appsacco_native/lib/main.dart
          if grep -q "WebView" /tmp/appsacco_native/lib/main.dart; then
            echo 'Native v2.1 must not contain WebView code' >&2
            exit 1
          fi

      - name: Get packages
        working-directory: /tmp/appsacco_native
        run: flutter pub get

      - name: Format
        working-directory: /tmp/appsacco_native
        run: dart format lib/main.dart

      - name: Generate launcher icon
        working-directory: /tmp/appsacco_native
        run: dart run flutter_launcher_icons

      - name: Generate splash
        working-directory: /tmp/appsacco_native
        run: dart run flutter_native_splash:create

      - name: Analyze
        working-directory: /tmp/appsacco_native
        run: flutter analyze lib/main.dart --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        working-directory: /tmp/appsacco_native
        run: flutter build apk --release

      - name: Package APK
        shell: bash
        run: |
          set -euxo pipefail
          test -s /tmp/appsacco_native/build/app/outputs/flutter-apk/app-release.apk
          cp /tmp/appsacco_native/build/app/outputs/flutter-apk/app-release.apk APP_SACCO_NATIVE_v2.1.0.apk
          sha256sum APP_SACCO_NATIVE_v2.1.0.apk > APP_SACCO_NATIVE_v2.1.0.sha256.txt
          ls -lh APP_SACCO_NATIVE_v2.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APP_SACCO_NATIVE_V2_1_0_APK
          path: |
            APP_SACCO_NATIVE_v2.1.0.apk
            APP_SACCO_NATIVE_v2.1.0.sha256.txt
          retention-days: 7
