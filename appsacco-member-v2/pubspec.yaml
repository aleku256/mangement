name: app_sacco_mobile
version: 1.1.0+2
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_sacco_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_sacco_logo.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/app_sacco_logo.png
  min_sdk_android: 23

flutter_native_splash:
  color: '#F4FBF6'
  image: assets/app_sacco_logo.png
  android_12:
    color: '#F4FBF6'
    image: assets/app_sacco_logo.png
